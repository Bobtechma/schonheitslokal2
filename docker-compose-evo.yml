version: '3.8'

services:
  evo-postgres:
    image: postgres:15
    container_name: evo-postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_password
      POSTGRES_DB: evolution_db
    ports:
      - '5433:5432'
    volumes:
      - evo_postgres_data:/var/lib/postgresql/data

  evo-redis:
    image: redis:7-alpine
    container_name: evo-redis
    restart: always
    ports:
      - '6380:6379'

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - '8085:8080'
    environment:
      - SERVER_URL=http://localhost:8085
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=salon_key_123
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_HOST=evo-redis
      - CACHE_REDIS_PORT=6379
      - CACHE_REDIS_DB=0
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_password@evo-postgres:5432/evolution_db?sslmode=disable
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_salon
    depends_on:
      - evo-postgres
      - evo-redis

volumes:
  evo_postgres_data:
